name: Build and Release Executable

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

jobs:
  build-and-release:
    name: Build Executable & Create Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Windows Executable
        run: |
          pyinstaller --onefile --name Antigravity_Conversation_Fix rebuild_conversations.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Antigravity_Conversation_Fix.exe
          body: |
            ## 🚀 Antigravity Conversation Fix

            Automated precompiled executable release for Windows.

            ### ⚡ Quick Start
            1. **Close Antigravity** completely.
            2. Download **`Antigravity_Conversation_Fix.exe`** attached below.
            3. Double-click the executable to start the fix.
            4. Follow the on-screen prompts to rebuild your conversation index.
            5. Restart Antigravity to see your restored and sorted chat history!

            ---
            *No Python or extra setup required. Built automatically via GitHub Actions.*
